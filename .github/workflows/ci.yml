name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Three operating systems on purpose. The suite was green on Linux and red
    # on macOS for weeks because two tests hardcoded /tmp while the hooks had
    # moved to tempfile.gettempdir() - and on Linux those are the same path.
    # A single-OS matrix would have reported that as passing.
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest

      - name: Run tests
        run: python -m pytest tests/ -q

  # What this job does NOT prove, stated so a green tick is not over-read:
  # it runs the hook scripts as ordinary programs. It does not exercise Claude
  # Code spawning them, so it cannot show which shell is chosen, whether the
  # `shell` field is honoured, or what a Windows box WITHOUT Git Bash does -
  # GitHub's windows-latest image ships Git Bash, so that case never occurs here.
  shellcheck:
    name: shellcheck (bash hooks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Lint shell scripts
        # severity=warning: style-level info findings (e.g. SC2012 "use find
        # instead of ls") should not block a merge. Warnings and errors do.
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck --severity=warning hooks/scripts/*.sh setup.sh
